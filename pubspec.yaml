name: iregexp
description: "An implementation of RFC 9485 I-Regexp: An Interoperable Regexp Format. Checks the I-Regexp for correctness, allows matching by substring or by entire string."
version: 0.2.0
repository: https://github.com/f3ath/iregexp

environment:
  sdk: ^3.8.0
dependencies:
  petitparser: ^7.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.21.1
  check_coverage: ^0.0.4

cider:
  link_template:
    tag: https://github.com/f3ath/iregexp/releases/tag/%tag%
    diff: https://github.com/f3ath/iregexp/compare/%from%...%to%